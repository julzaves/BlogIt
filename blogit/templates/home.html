{% extends "layout.html" %}
{% block content %}
    {% for post in posts %}
        <article class="media content-section">
          <img class="rounded-circle article-img" src="{{ url_for('static', filename='profile_pictures/' + post.user.image_file) }}">
          <div class="media-body">
            <div class="article-metadata">
              <a class="mr-2" href="#">{{ post.user.username }}</a>
              <small class="text-muted">{{ post.date_posted.strftime('%Y-%m-%d') }}</small>
              <small class="text-muted ml-3">Comments: <span class="comment-count" data-post-id="{{ post.id }}">...</span></small>
            </div>
            <h2><a class="article-title" href="{{ url_for('main.post', post_id=post.id) }}">{{ post.title }}</a></h2>
            <p class="article-content">{{ post.content }}</p>
          </div>
        </article>
    {% endfor %}

    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const counters = document.querySelectorAll('.comment-count');
        counters.forEach(counter => {
          const postId = counter.dataset.postId;
          fetch(`/api/posts/${postId}/comments`)
            .then(response => {
              if (!response.ok) {
                throw new Error('Unable to load comment count');
              }
              return response.json();
            })
            .then(data => {
              if (Array.isArray(data)) {
                counter.textContent = data.length;
              } else {
                counter.textContent = '0';
              }
            })
            .catch(() => {
              counter.textContent = '0';
            });
        });
      });
    </script>
{% endblock %}
