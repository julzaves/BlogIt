{% extends "layout.html" %}
{% block content %}
    <article class="media content-section">
      <img class="rounded-circle article-img" src="{{ url_for('static', filename='profile_pictures/' + post.user.image_file) }}">
      <div class="media-body">
        <div class="article-metadata">
          <a class="mr-2" href="#">{{ post.user.username }}</a>
          <small class="text-muted">{{ post.date_posted.strftime('%Y-%m-%d') }}</small>
          {% if post.user == current_user %}
            <div>
                <a class="btn btn-secondary btn-small mt-1 mb-1" href="{{ url_for('main.update_post', post_id = post.id) }}">Update</a>
                <button type="button" class="btn btn-danger btn_sm m-1"  data-toggle="modal" data-target="#deleteModal">Delete</button>
            </div>
          {% endif %}
        </div>
        <h2 class="article-title">{{ post.title }}</h2>
        <p class="article-content">{{ post.content }}</p>
      </div>
    </article>

    <section class="mt-4">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Comments for this Post</h5>
          <div id="api-comments-box" class="small text-muted">Loading comments from the API...</div>
        </div>
      </div>
    </section>

    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const box = document.getElementById('api-comments-box');
        if (!box) {
          return;
        }

        fetch(`/api/posts/{{ post.id }}/comments`)
          .then(response => {
            if (!response.ok) {
              throw new Error('Failed to load comments: ' + response.status);
            }
            return response.json();
          })
          .then(data => {
            if (!Array.isArray(data) || data.length === 0) {
              box.textContent = 'No comments available for this post.';
              return;
            }

            const list = document.createElement('ul');
            list.className = 'list-group list-group-flush';

            data.forEach(comment => {
              const item = document.createElement('li');
              item.className = 'list-group-item';
              item.innerHTML = `
                <div><strong>${comment.author || 'Anonymous'}</strong> <small class="text-muted">on ${comment.date_posted ? comment.date_posted.split('T')[0] : 'unknown'}</small></div>
                <p class="mb-0">${comment.content}</p>
              `;
              list.appendChild(item);
            });

            box.innerHTML = '';
            box.appendChild(list);
          })
          .catch(error => {
            box.textContent = 'Unable to load comments from the API. ' + error.message;
          });
      });
    </script>

    <!-- Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1" role="dialog" aria-labelledby="deleteModalLabel" aria-hidden="true">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="deleteModalLabel">Delete Post?</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
            <form action="{{ url_for('main.delete_post', post_id = post.id) }}" method="POST">
                <input class="btn btn-danger" type="submit" value="Delete">
            </form>
          </div>
        </div>
      </div>
    </div>
{% endblock %}
